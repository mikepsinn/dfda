name: Crowdsourcing Cures Tests

on:
  push:
    paths:
      - 'apps/crowdsourcing-cures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/crowdsourcing-cures/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Cache Next.js build output
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/crowdsourcing-cures/.next/cache
            apps/crowdsourcing-cures/.next-ci/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/crowdsourcing-cures/**.[jt]s', 'apps/crowdsourcing-cures/**.[jt]sx', 'apps/crowdsourcing-cures/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # Ensure cache directories exist
      - name: Create cache directories
        run: mkdir -p apps/crowdsourcing-cures/.next/cache apps/crowdsourcing-cures/.next-ci/cache
        shell: bash
            
      # Install dependencies
      - name: Install dependencies
        # Limit linking to the React 18 legacy app and its workspace dependencies.
        # Installing every sibling app also hoists React 19 Radix peer types into
        # the root node_modules tree, which makes this app's JSX types conflict.
        run: pnpm --filter crowdsourcing-cures... install --frozen-lockfile
            
      # Setup environment variables
      - name: Setup environment variables
        working-directory: apps/crowdsourcing-cures
        run: |
          cp .env.example .env
          echo "USE_LOCAL_REDIS=true" >> .env
          echo "LOCAL_REDIS_URL=redis://localhost:6379" >> .env

      # Setup Docker and Docker Compose
      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      # Start database for tests
      - name: Start test database and Redis
        working-directory: apps/crowdsourcing-cures
        run: |
          docker compose -f docker-compose.test.yml up -d db redis
          echo "Waiting for database to be ready..."
          timeout 30 bash -c 'until docker exec dfda-postgres pg_isready; do sleep 2; done' || false
          echo "Waiting for Redis to be ready..."
          timeout 30 bash -c 'until docker exec redis redis-cli ping; do sleep 2; done' || false
            
      # Setup database schema
      - name: Setup database schema
        working-directory: apps/crowdsourcing-cures
        run: pnpm prisma:migrate

      # Run unit tests
      - name: Run unit tests
        working-directory: apps/crowdsourcing-cures
        run: pnpm test:unit --reporters=default --reporters=github-actions
        env:
          CI: true

      # Run TypeScript in its own process so Next's build worker does not retain
      # the compiler graph alongside the production build.
      - name: Run type check
        working-directory: apps/crowdsourcing-cures
        run: pnpm type-check
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=10240
            
      # Build and run integration tests
      - name: Build and run integration tests
        working-directory: apps/crowdsourcing-cures
        run: |
          pnpm run build
          pnpm start &
          echo "Waiting for Next.js to be ready..."
          timeout 30 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:3000)" != "200" ]]; do sleep 2; done' || false
          pnpm test:integration --reporters=default --reporters=github-actions --verbose
        env:
          CI: true
          NEXT_SKIP_BUILD_TYPECHECK: true

      # Upload test results and coverage reports
      - name: Upload test results
        if: always()
        run: |
          mkdir -p apps/crowdsourcing-cures/coverage apps/crowdsourcing-cures/test-results
          find apps/crowdsourcing-cures -name "junit.xml" -o -name "test-report.html" -o -path "apps/crowdsourcing-cures/coverage/*" -o -path "apps/crowdsourcing-cures/test-results/*" > artifact_list.txt
          if [ -s artifact_list.txt ]; then
            echo "Found test artifacts to upload"
            cat artifact_list.txt
          else
            echo "No test artifacts found to upload"
            exit 0
          fi
        shell: bash

      - name: Upload artifacts
        if: always() && success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/crowdsourcing-cures/coverage/
            apps/crowdsourcing-cures/test-results/
            apps/crowdsourcing-cures/**/junit.xml
            apps/crowdsourcing-cures/test-report.html
            apps/crowdsourcing-cures/unit-test-report.html
          retention-days: 30
