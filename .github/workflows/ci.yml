name: dFDA Node Tests

on:
  push:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  check-and-build:
    name: Check and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SITE_NAME: Open Treatment Evidence Network
          NEXT_PUBLIC_SITE_DESCRIPTION: Decentralized clinical trials and health research
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfda_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Build the schema in plain PostgreSQL
        run: pnpm db:plain:setup

      - name: Check that the Prisma schema matches the migrations
        run: |
          cp prisma/schema.prisma "$RUNNER_TEMP/schema.prisma"
          pnpm exec prisma db pull
          diff -u "$RUNNER_TEMP/schema.prisma" prisma/schema.prisma

      - name: Run database tests
        run: pnpm test:db
