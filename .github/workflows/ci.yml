name: dFDA Node Tests

on:
  push:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  check-and-build:
    name: Check and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dfda
          GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
          BETTER_AUTH_SECRET: test-better-auth-secret-with-at-least-32-characters
          SMTP_URL: smtp://127.0.0.1:2525
          EMAIL_FROM: test@example.com
          NEXT_PUBLIC_SITE_NAME: Open Treatment Evidence Network
          NEXT_PUBLIC_SITE_DESCRIPTION: Decentralized clinical trials and health research
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfda_test
      # moto: an S3-compatible test server for the file storage tests
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: dfda-test
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Build the schema in plain PostgreSQL
        run: pnpm db:plain:setup

      - name: Check that the Prisma schema matches the migrations
        run: |
          cp prisma/schema.prisma "$RUNNER_TEMP/schema.prisma"
          pnpm exec prisma db pull
          diff -u "$RUNNER_TEMP/schema.prisma" prisma/schema.prisma

      - name: Start the S3 test server
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.3"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/moto.log"
          exit 1

      - name: Run database tests
        run: pnpm test:db

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfda_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The same placeholder settings as the build in "Check and Build"; no outside service is contacted.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfda_e2e
      NODE_OPTIONS: --max-old-space-size=4096
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
      BETTER_AUTH_SECRET: test-better-auth-secret-with-at-least-32-characters
      SMTP_URL: smtp://127.0.0.1:2525
      EMAIL_FROM: test@example.com
      NEXT_PUBLIC_SITE_NAME: Open Treatment Evidence Network
      NEXT_PUBLIC_SITE_DESCRIPTION: Decentralized clinical trials and health research
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Build the database with the demo data
        run: |
          pnpm db:plain:setup
          pnpm db:seed:demo

      - name: Build
        run: pnpm build

      - name: Start the app
        run: |
          (nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &)
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Install Chromium
        run: |
          # The runner's Microsoft apt source sometimes answers 403 and stops apt; nothing here needs it.
          sudo grep -ls packages.microsoft.com /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Show the app log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
