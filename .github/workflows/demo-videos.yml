name: Demo videos

# Records the clinic demo's journeys (apps/web/content/clinic-demo/script.md)
# as videos: the browser tests' setup, then `pnpm demo:video`. Run it by hand
# from the Actions tab; the videos are an artifact of the run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record the demo videos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfda_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The same placeholder settings as the browser tests in ci.yml; no outside service is contacted.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfda_e2e
      NODE_OPTIONS: --max-old-space-size=4096
      GOOGLE_GENERATIVE_AI_API_KEY: test-google-generative-ai-key
      BETTER_AUTH_SECRET: test-better-auth-secret-with-at-least-32-characters
      SMTP_URL: smtp://127.0.0.1:2525
      EMAIL_FROM: test@example.com
      NEXT_PUBLIC_SITE_NAME: Open Treatment Evidence Network
      NEXT_PUBLIC_SITE_DESCRIPTION: Decentralized clinical trials and health research
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dFDA Node dependencies
        working-directory: .
        run: pnpm --filter web... install --frozen-lockfile

      - name: Build the database with the demo data
        run: |
          pnpm db:plain:setup
          pnpm db:seed:demo

      - name: Build
        run: pnpm build

      - name: Start the app
        run: |
          (nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &)
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Install Chromium and ffmpeg
        run: |
          # The runner's Microsoft apt source sometimes answers 403 and stops apt; nothing here needs it.
          sudo grep -ls packages.microsoft.com /etc/apt/sources.list.d/* | xargs -r sudo rm -f
          # The runner has Google Chrome, and so the system libraries that Chromium needs; install them with apt
          # (10 to 20 minutes) only if Chromium cannot start.
          pnpm exec playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())" || pnpm exec playwright install-deps chromium
          sudo apt-get install -y ffmpeg

      - name: Record the videos
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm demo:video

      - name: Show the app log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"

      - name: Upload the videos
        uses: actions/upload-artifact@v4
        with:
          name: demo-videos
          path: apps/web/demo-videos
          retention-days: 30
