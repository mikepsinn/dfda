      <path id="10-results-loop-cguide-1" d="M1472 676L1472 578" />
      <path id="10-results-loop-cguide-2" d="M1634 676L1577.3 578" />
    </svg>
    <div id="10-results-loop-dots"></div>

    <!-- orange loop arrow from the label back to step 1, then the next patient -->
    <svg id="10-results-loop-arrow-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="10-results-loop-arrow-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <path id="10-results-loop-arrow-reveal" d="M1200 314C1200 150 1060 36 880 36L200 36C136 36 106 50 106 76" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        </mask>
      </defs>
      <path id="10-results-loop-arrow" d="M1200 314C1200 150 1060 36 880 36L200 36C136 36 106 50 106 76" fill="none" stroke="#F0A050" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round" mask="url(#10-results-loop-arrow-mask)" />
      <path id="10-results-loop-arrow-head" d="M96 65L106 77L116 65" fill="none" stroke="#F0A050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <circle id="10-results-loop-halo" cx="106" cy="92" r="16" fill="#694CFA" fill-opacity="0.08" stroke="#694CFA" stroke-opacity="0.4" stroke-width="2" />
    </svg>
    <div id="10-results-loop-connector"></div>
    <div id="10-results-loop-avatar">
      <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="21" r="9.5" fill="#694CFA" fill-opacity="0.7" />
        <path d="M8 58C8 42 17 34 28 34S48 42 48 58Z" fill="#694CFA" fill-opacity="0.7" />
      </svg>
    </div>
    <div id="10-results-loop-next">Next patient</div>

    <!-- Margaret's record chip (topmost while it docks) -->
    <div id="10-results-loop-chip-dock">
      <div id="10-results-loop-chip">
        <svg id="10-results-loop-chip-icon" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="16" fill="#694CFA" />
          <path id="10-results-loop-chip-check" d="M11 18.5l4.6 4.6L25.5 13" fill="none" stroke="#F8F6F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span id="10-results-loop-chip-name">Margaret<span id="10-results-loop-redact" data-layout-allow-occlusion></span></span>
        <span id="10-results-loop-chip-rest">· month 6 · outcome recorded</span>
      </div>
    </div>

  </div>
</div>

<script>
  (function () {
    var P = "10-results-loop-";
    function byId(id) {
      return document.getElementById(P + id);
    }
    var TEXT = "#0F172A";
    var MUTED = "#475569";

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true, defaults: { force3D: false } });

    // svg-path-draw: dash = measured length; offset parked past the cap so nothing shows at t0
    function draw(path, at, dur, ease) {
      var len = Math.ceil(path.getTotalLength()) + 2;
      var pad = 24;
      path.style.strokeDasharray = len + " " + (len * 2 + pad);
      tl.fromTo(
        path,
        { strokeDashoffset: len + pad },
        { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
        at
      );
    }

    // ===== Scene 1 (0.0-2.6s): header reveals; Margaret's record chip pops on "six months" =====
    tl.fromTo(
      byId("minipath"),
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" },
      0.08
    );
    tl.fromTo(
      byId("dot5"),
      { scale: 0.3, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.45, ease: "back.out(2.2)" },
      0.34
    );
    tl.fromTo(
      byId("dot6"),
      { scale: 0.3, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.45, ease: "back.out(2.2)" },
      0.46
    );
    tl.fromTo(
      byId("eyebrow-text"),
      { opacity: 0, x: -14 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      0.18
    );
    tl.fromTo(
      byId("chip"),
      { opacity: 0, scale: 0.86, y: 18 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.47
    );
    draw(byId("chip-check"), 0.72, 0.42, "power2.out");
    // dock: centre (960,440) -> top-right tag position, right edge on the 1824 margin
    tl.fromTo(
      byId("chip-dock"),
      { x: 0, y: 0, scale: 1 },
      { x: 612.4, y: -354, scale: 0.68, duration: 0.75, ease: "power3.inOut", immediateRender: false },
      1.98
    );

    // ===== Scene 2 (2.6-6.6s): the example report rises; bars grow on their words =====
    tl.fromTo(
      byId("report"),
      { x: 414 },
      { x: 0, duration: 0.85, ease: "power3.inOut" },
      7.42
    );
    tl.fromTo(
      byId("card"),
      { opacity: 0, y: 56 },
      { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
      2.2
    );
    tl.fromTo(
      byId("title"),
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      2.36
    );
    tl.fromTo(
      byId("tag"),
      { opacity: 0, x: -12 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      2.44
    );

    // stat-bars-and-fills (progress-fill bar form): authored widths, revealed from the left edge
    var BARS = [
      { i: 0, at: 2.65 }, // "good"      -> Improved 44%
      { i: 2, at: 3.07 }, // "bad"       -> Worsened 13%
      { i: 1, at: 3.54 }, // "no change" -> No real change 29%
      { i: 3, at: 4.0 }, //                 Stopped 8%
      { i: 4, at: 4.14 } //                 Lost to follow-up 6%
    ];
    BARS.forEach(function (b) {
      tl.fromTo(
        byId("fill-" + b.i),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power2.out" },
        b.at
      );
      tl.fromTo(
        byId("label-" + b.i),
        { color: MUTED },
        { color: TEXT, duration: 0.3, ease: "power1.out" },
        b.at
      );
      tl.fromTo(
        byId("val-" + b.i),
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        b.at + 0.22
      );
    });

    // "de-identified" (4.82s): chip + Margaret's name is redacted on her record
    tl.fromTo(
      byId("chip-deid"),
      { opacity: 0, scale: 0.85, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" },
      4.82
    );
    tl.fromTo(
      byId("redact"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.42, ease: "power2.inOut" },
      4.92
    );
    // "published" (5.80s): public registry chip
    tl.fromTo(
      byId("foot-arrow"),
      { opacity: 0, x: -8 },
      { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
      5.66
    );
    tl.fromTo(
      byId("chip-pub"),
      { opacity: 0, scale: 0.85, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" },
      5.8
    );

    // ===== Scene 3 (6.6-8.0s): "Nothing hidden" stamp, one smooth scale settle =====
    tl.fromTo(
      byId("stamp"),
      { opacity: 0, scale: 1.45, rotation: -7 },
      { opacity: 1, scale: 1, rotation: -7, duration: 0.5, ease: "power3.out" },
      6.7
    );

    // ===== Scene 4 (8.0-11.1s): report slides left, label enters, results pool into it =====
    // (report wrapper x 414 -> 0 at 7.42 is registered above)
    tl.fromTo(
      byId("label"),
      { opacity: 0, x: 70 },
      { opacity: 1, x: 0, duration: 0.85, ease: "power3.out" },
      7.62
    );
    var i, k, j;
    for (i = 0; i < 5; i++) {
      draw(byId("guide-" + i), 8.0 + i * 0.04, 0.4, "power2.out");
    }

    var dotsHost = byId("dots");
    function makeDot(x, y, size) {
      var d = document.createElement("div");
      d.className = P + "dot";
      d.style.left = x - size / 2 + "px";
      d.style.top = y - size / 2 + "px";
      d.style.width = size + "px";
      d.style.height = size + "px";
      dotsHost.appendChild(d);
      return d;
    }
    function fadeInOut(d, at, dur) {
      tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, at);
      tl.fromTo(
        d,
        { opacity: 1 },
        { opacity: 0, duration: 0.14, ease: "power1.in", immediateRender: false },
        at + dur - 0.14
      );
    }

    // report rows -> label (two results per row, staggered)
    for (i = 0; i < 5; i++) {
      var y0 = 414 + 70 * i;
      var y1 = 404 + 22 * i;
      for (k = 0; k < 2; k++) {
        var at = 8.12 + i * 0.09 + k * 0.42;
        var dur = 0.62;
        var d = makeDot(1000, y0, 12);
        tl.fromTo(d, { x: 0 }, { x: 119, duration: dur, ease: "none" }, at);
        tl.fromTo(d, { y: 0 }, { y: y1 - y0, duration: dur, ease: "sine.inOut" }, at);
        fadeInOut(d, at, dur);
      }
    }

    // other clinics pop in and pool into the same label
    var CLINICS = [1310, 1472, 1634];
    for (j = 0; j < 3; j++) {
      tl.fromTo(
        byId("clinic-" + j),
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" },
        8.3 + j * 0.12
      );
      draw(byId("cguide-" + j), 8.5 + j * 0.08, 0.35, "power2.out");
    }
    tl.fromTo(
      byId("clinics-cap"),
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      8.62
    );
    for (j = 0; j < 3; j++) {
      var xc = CLINICS[j];
      var xe = xc + (1472 - xc) * 0.35;
      for (k = 0; k < 3; k++) {
        var cat = 8.72 + j * 0.1 + k * 0.26;
        var cdur = 0.5;
        var cd = makeDot(xc, 674, 10);
        tl.fromTo(
          cd,
          { x: 0, y: 0 },
          { x: xe - xc, y: -96, duration: cdur, ease: "power1.inOut" },
          cat
        );
        fadeInOut(cd, cat, cdur);
      }
    }

    // "updates the label" (9.73s): Updated chip, border warms, a sheen passes over the label
    tl.fromTo(
      byId("updated"),
      { opacity: 0, scale: 0.7 },
      { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" },
      9.73
    );
    tl.fromTo(
      byId("updated-icon"),
      { rotation: -140, transformOrigin: "50% 50%" },
      { rotation: 0, duration: 0.7, ease: "power2.out" },
      9.73
    );
    tl.fromTo(
      byId("label"),
      { borderColor: "rgba(105, 76, 250, 0.2)" },
      { borderColor: "rgba(105, 76, 250, 0.55)", duration: 0.45, ease: "power1.out", immediateRender: false },
      9.75
    );
    tl.fromTo(
      byId("sheen"),
      { x: -220 },
      { x: 760, duration: 0.9, ease: "power1.inOut" },
      9.8
    );

    // ===== Scene 5 (11.1-14.6s): orange loop arrow back to step 1; the next patient appears =====
    draw(byId("arrow-reveal"), 11.28, 1.5, "power2.out");
    tl.fromTo(
      byId("arrow-head"),
      { opacity: 0, scale: 0.4, transformOrigin: "50% 100%" },
      { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
      12.55
    );
    tl.fromTo(
      byId("dot1-on"),
      { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" },
      12.66
    );
    tl.fromTo(
      byId("halo"),
      { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" },
      12.7
    );
    tl.fromTo(
      byId("connector"),
      { scaleY: 0 },
      { scaleY: 1, duration: 0.3, ease: "power2.out" },
      12.84
    );
    tl.fromTo(
      byId("avatar"),
      { opacity: 0, scale: 0.6, y: -10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
      12.92
    );
    tl.fromTo(
      byId("next"),
      { opacity: 0, x: -12 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      13.12
    );
    // hold to the end of the frame (no exit)
    tl.set({}, {}, 14.602);

    window.__timelines["10-results-loop"] = tl;
  })();
</script>
</template>
