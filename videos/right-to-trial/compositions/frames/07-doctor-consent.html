      var len = Math.ceil(path.getTotalLength()) + 1;
      path.style.strokeDasharray = len + " " + len;
      tl.fromTo(
        path,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
        at
      );
    }

    // ===== Scene 1 (0.0-3.1s): header, the video visit rises in on "Her own doctor",
    // the call connects, and "Telemedicine is fine" pops beneath on "video visit" =====
    tl.fromTo(
      byId("minipath"),
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" },
      0.05
    );
    tl.fromTo(
      byId("dot2"),
      { scale: 0.3, svgOrigin: "36 10" },
      { scale: 1, svgOrigin: "36 10", duration: 0.45, ease: "back.out(2.2)" },
      0.12
    );
    tl.fromTo(
      byId("dot3"),
      { scale: 0.3, svgOrigin: "62 22" },
      { scale: 1, svgOrigin: "62 22", duration: 0.45, ease: "back.out(2.2)" },
      0.2
    );
    tl.fromTo(
      byId("eyebrow-text"),
      { opacity: 0, x: -14 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      0.15
    );

    tl.fromTo(
      byId("illo"),
      { opacity: 0, y: 70 },
      { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
      0.22
    );
    tl.fromTo(
      byId("glow"),
      { opacity: 0, scale: 0.85 },
      { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" },
      0.3
    );
    // the call connects: the doctor rises into frame on the laptop screen
    tl.fromTo(
      byId("doc"),
      { opacity: 0, y: 46 },
      { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
      0.45
    );

    // h2 (step 2) on "recommends"
    var wordsA = byClass("word", byId("h2-a"));
    wordsA.forEach(function (w, i) {
      tl.fromTo(
        w,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.95 + i * 0.08
      );
    });

    // Margaret's inset pops in on "over a video"
    tl.fromTo(
      byId("inset"),
      { opacity: 0, scale: 0, svgOrigin: "326 209" },
      { opacity: 1, scale: 1, svgOrigin: "326 209", duration: 0.5, ease: "power3.out" },
      1.55
    );

    // spring-pop (smooth settle) on "video visit"
    tl.fromTo(
      byId("pill"),
      { opacity: 0, scale: 0, y: 12 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
      1.95
    );
    draw(byId("pill-check"), 2.22, 0.32, "power2.out");

    // macro move underneath: slow push on the illustration for the rest of the shot
    tl.fromTo(
      byId("illo-push"),
      { scale: 1 },
      { scale: 1.035, duration: 12.157, ease: "sine.inOut" },
      1.2
    );

    // ===== Scene 2 (3.1-6.6s): "Not required" card builds; each row strikes through as it lands =====
    var nrCard = byId("nr-card");
    tl.fromTo(
      nrCard,
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      3.1
    );
    byClass("ico", nrCard).forEach(function (p, k) {
      draw(p, 3.3 + k * 0.28, 0.45, "power2.out");
    });
    tl.fromTo(
      byId("nr-title"),
      { opacity: 0, x: -12 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      3.2
    );
    tl.fromTo(
      byId("nr-divider"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.55, ease: "power2.out" },
      3.3
    );

    var NR_AT = [3.8, 4.74, 5.44]; // "dying" 3.92 · "approved drugs" 4.86 · ~5.6
    byClass("nr-row", nrCard).forEach(function (row, i) {
      var at = NR_AT[i];
      tl.fromTo(
        row,
        { opacity: 0, x: 28 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        at
      );
      tl.fromTo(
        byClass("strike", row)[0],
        { scaleX: 0 },
        { scaleX: 1, duration: 0.32, ease: "power2.inOut" },
        at + 0.3
      );
      draw(byClass("nr-x", row)[0], at + 0.3, 0.3, "power2.out");
      tl.to(byClass("label", row)[0], { color: MUTED, duration: 0.3, ease: "power1.out" }, at + 0.3);
    });

    // ===== Scene 3 (6.6-13.4s): on "She signs" the card cuts left (cut-the-curve) and the
    // consent form takes its place; the h2 waterfalls to step 3; rows tick on their cues =====
    var CUT = 6.72;
    tl.to(nrCard, { x: -230, duration: 0.3, ease: "power4.in" }, CUT - 0.3);
    tl.to(nrCard, { opacity: 0, duration: 0.24, ease: "power1.in" }, CUT - 0.26);

    // waterfall cut on the headline: per-word exit, last word dies at the cut
    var EXIT_STAGGER = 0.022;
    var exitStart = CUT - 0.18 - (wordsA.length - 1) * EXIT_STAGGER;
    wordsA.forEach(function (w, i) {
      var s = exitStart + i * EXIT_STAGGER;
      tl.to(w, { x: -230, duration: 0.34, ease: "power4.in" }, s);
      tl.to(w, { opacity: 0, duration: 0.18, ease: "power1.in" }, s);
    });
    var wordsB = byClass("word", byId("h2-b"));
    var gap = 0.05;
    var entryAt = CUT;
    wordsB.forEach(function (w) {
      tl.fromTo(
        w,
        { opacity: 0, x: 230 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" },
        entryAt
      );
      entryAt += gap;
      gap *= 0.84;
    });

    // step 3 dot answers with a single pulse
    tl.fromTo(
      byId("dot3-pulse"),
      { opacity: 0, scale: 1, svgOrigin: "62 22" },
      { opacity: 0.8, scale: 1.15, svgOrigin: "62 22", duration: 0.08, ease: "power1.out" },
      6.64
    );
    tl.to(byId("dot3-pulse"), { opacity: 0, scale: 2.4, svgOrigin: "62 22", duration: 0.6, ease: "power2.out" }, 6.72);

    var cfCard = byId("cf-card");
    tl.fromTo(
      cfCard,
      { opacity: 0, x: 230 },
      { opacity: 1, x: 0, duration: 0.38, ease: "power4.out" },
      CUT
    );
    byClass("ico", cfCard).forEach(function (p, k) {
      draw(p, 6.92 + k * 0.3, 0.5, "power2.out");
    });
    tl.fromTo(
      byId("cf-divider"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.55, ease: "power2.out" },
      6.95
    );
    // "plain-language" (7.13)
    tl.fromTo(
      byId("cf-sub"),
      { opacity: 0, x: -10 },
      { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
      7.08
    );

    // checklist rows assemble unticked (staggered stack into slot)
    var cfRows = byClass("cf-row", cfCard);
    cfRows.forEach(function (row, i) {
      tl.fromTo(
        row,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.05 + i * 0.1
      );
    });

    // the e-signature writes itself on "consent:"
    tl.fromTo(
      byId("sig-line"),
      { scaleX: 0 },
      { scaleX: 1, duration: 0.5, ease: "power2.out" },
      7.4
    );
    draw(byId("sig-ink"), 7.85, 0.85, "power1.inOut");

    // ticks on their cues: "risks" 9.04 · "unknowns" 9.86 · "pays" 10.79 · "experimental" 12.12
    var TICK_AT = [9.0, 9.82, 10.75, 12.08];
    cfRows.forEach(function (row, i) {
      var at = TICK_AT[i];
      tl.fromTo(
        byClass("box-fill", row)[0],
        { opacity: 0, scale: 0.5, svgOrigin: "20 20" },
        { opacity: 1, scale: 1, svgOrigin: "20 20", duration: 0.28, ease: "power3.out" },
        at
      );
      draw(byClass("box-check", row)[0], at + 0.08, 0.26, "power2.out");
      var ripple = byClass("ripple", row)[0];
      tl.fromTo(
        ripple,
        { opacity: 0, scale: 1 },
        { opacity: 0.7, scale: 1.12, duration: 0.08, ease: "power1.out" },
        at + 0.04
      );
      tl.to(ripple, { opacity: 0, scale: 1.9, duration: 0.55, ease: "power2.out" }, at + 0.12);
      tl.to(byClass("label", row)[0], { color: INK, duration: 0.3, ease: "power1.out" }, at);
    });

    // hold on the fully ticked form to the frame's fixed length (13.357s) — no exit
    window.__timelines["07-doctor-consent"] = tl;
  })();
</script>
</template>
