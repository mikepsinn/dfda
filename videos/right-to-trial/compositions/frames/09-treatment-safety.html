<script>
  (function () {
    var P = "09-treatment-safety-";
    function byId(id) {
      return document.getElementById(P + id);
    }
    function byClass(cls, scope) {
      return Array.prototype.slice.call((scope || document).getElementsByClassName(P + cls));
    }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // svg-path-draw: dash = measured length, offset length -> 0
    function draw(path, at, dur, ease) {
      var len = Math.ceil(path.getTotalLength()) + 1;
      path.style.strokeDasharray = len + " " + len;
      tl.fromTo(
        path,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
        at
      );
    }

    // ---------- chip layout states (wrapper transform-origin 0 0; DOM position = docked row, top-right) ----------
    // Scene 1: stacked at canvas centre, scale 1.3 · Scene 2: stacked beside the phone, scale 1.1 · Scene 3: docked row
    var CHIP_A = { s1: { x: -138, y: 231, scale: 1.3 }, s2: { x: 0, y: 262, scale: 1.1 } };
    var CHIP_B = { s1: { x: -494.5, y: 331, scale: 1.3 }, s2: { x: -376, y: 344, scale: 1.1 } };
    var DOCK = { x: 0, y: 0, scale: 1 };

    // ring travel: Memory test row -> Check-in row, in image-box px (box is a fixed 367px tall)
    var TRAVEL = (0.703 - 0.128) * 367;

    // ===== Scene 1 (0.0-3.6s): header, then "Week 2 · first dose" and "Clinic near home" pop centre-stage =====
    tl.fromTo(
      byId("minipath"),
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" },
      0.05
    );
    tl.fromTo(
      byId("dot5"),
      { scale: 0.3, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.45, ease: "back.out(2.2)" },
      0.3
    );
    tl.fromTo(
      byId("eyebrow-text"),
      { opacity: 0, x: -14 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      0.15
    );

    // chip positions: Scene 1 centre state applied at t=0 by the fromTo
    tl.fromTo(byId("chip-a-pos"), CHIP_A.s1, Object.assign({ duration: 0.85, ease: "power3.inOut" }, CHIP_A.s2), 3.45);
    tl.fromTo(byId("chip-b-pos"), CHIP_B.s1, Object.assign({ duration: 0.85, ease: "power3.inOut" }, CHIP_B.s2), 3.5);

    // spring-pop-entrance (calm settle) on the voiceover cues
    tl.fromTo(
      byId("chip-a"),
      { scale: 0, opacity: 0, y: 12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.42
    );
    tl.fromTo(
      byId("chip-b"),
      { scale: 0, opacity: 0, y: 12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      2.22
    );
    tl.fromTo(
      byId("pin"),
      { opacity: 0, y: -7 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.48
    );

    // ===== Scene 2 (3.6-7.0s): the phone rises in; ring on "Memory test"; ring travels to "Check-in" =====
    tl.fromTo(
      byId("phone"),
      { y: 100 },
      { y: 0, duration: 0.95, ease: "power3.out" },
      3.62
    );
    tl.fromTo(byId("phone"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.62);
    tl.fromTo(
      byId("disc"),
      { opacity: 0, scale: 0.82 },
      { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
      3.72
    );

    tl.fromTo(
      byId("ring-memory"),
      { opacity: 0, scale: 1.06 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      4.08
    );
    tl.to(byId("ring-memory"), { opacity: 0, y: TRAVEL * 0.45, duration: 0.3, ease: "power2.in" }, 4.9);
    tl.fromTo(
      byId("ring-checkin"),
