    /* ---- closing lines under the card (above the caption band) ---- */

    }
    [id="01-meet-margaret-line1"] {

    }
  </style>

  <div
    id="root"
    data-composition-id="01-meet-margaret"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="19.485"
  >
    <div
      id="01-meet-margaret-bg"
      class="clip"
      data-start="0"
      data-duration="19.485"
      data-track-index="0"
    ></div>

    <div id="01-meet-margaret-camera">
      <div id="01-meet-margaret-portrait">
        <img src="public/margaret.png" alt="Illustration of Margaret" />
      </div>
      <div id="01-meet-margaret-name">Margaret, 68</div>
      <div id="01-meet-margaret-tag"><span>Alzheimer's disease</span></div>

      <div id="01-meet-margaret-field"></div>

      <div id="01-meet-margaret-card">
        <div id="01-meet-margaret-numwrap"><span id="01-meet-margaret-num">0</span></div>
        <div id="01-meet-margaret-label">existing drugs<br />that might help her</div>
      </div>

      <div id="01-meet-margaret-line1">Few have ever been tested for Alzheimer's.</div>
      <div id="01-meet-margaret-line2">Her doctor has no evidence for any of them.</div>
      <div id="01-meet-margaret-line3">
        <span>If she takes one, nobody records what happens.</span>
        <svg
          id="01-meet-margaret-record"
          viewBox="0 0 48 48"
          fill="none"
          stroke="#694CFA"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            id="01-meet-margaret-record-board"
            d="M18 9.5 H14 C12.3 9.5 11 10.8 11 12.5 V39 C11 40.7 12.3 42 14 42 H34 C35.7 42 37 40.7 37 39 V12.5 C37 10.8 35.7 9.5 34 9.5 H30"
          />
          <rect id="01-meet-margaret-record-clip" x="18" y="6" width="12" height="7" rx="2" />
          <path
            id="01-meet-margaret-record-blank"
            d="M17 21 H31 M17 27.5 H31 M17 34 H26"
            stroke="#94A3B8"
            stroke-width="2"
            stroke-dasharray="2.2 3.2"
          />
        </svg>
      </div>
    </div>

    <div id="01-meet-margaret-source">Source: Frontiers in Pharmacology, 2023</div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var P = "01-meet-margaret-";
      var byId = function (s) {
        return document.getElementById(P + s);
      };

      var PRIMARY = "#694CFA";
      var LIGHT = "#94A3B8";
      var SLOT = "rgba(105, 76, 250, 0.18)";
      var TOTAL = 573; // one dot per candidate drug (24 columns)
      var COLS = 24;

      // build the dot field deterministically, index order = row-major
      var field = byId("field");
      field.textContent = "";
      var dots = [];
      for (var i = 0; i < TOTAL; i++) {
        var d = document.createElement("span");
        field.appendChild(d);
        dots.push(d);
      }

      // "few ever tested": a small, fixed, scattered handful stays purple.
      // [row, col] picks avoid the cells the counter card covers (cols 0-7, rows 7-20).
      // Purely visual; no count is shown or implied.
      var FEW_CELLS = [
        [1, 5],
        [3, 19],
        [7, 12],
        [10, 22],
        [13, 9],
        [17, 17],
        [20, 11],
        [22, 3],
      ];
      var isFew = {};
      for (var f = 0; f < FEW_CELLS.length; f++) {
        isFew[FEW_CELLS[f][0] * COLS + FEW_CELLS[f][1]] = true;
      }
      var greyDots = [];
      for (var g = 0; g < TOTAL; g++) {
        if (!isFew[g]) greyDots.push(dots[g]);
      }

      var num = byId("num");
      num.textContent = "0";

      // svg-path-draw setup: measured length, dash parked fully off the path
      function prepDraw(path, fallback) {
        var len = 0;
        try {
          len = path.getTotalLength();
        } catch (e) {
          len = 0;
        }
        if (!(len > 0)) len = fallback;
        path.style.strokeDasharray = len + " " + (len + 40);
        path.style.strokeDashoffset = String(len + 20);
        return len;
      }
      var boardPath = byId("record-board");
      var clipRect = byId("record-clip");
      var boardLen = prepDraw(boardPath, 104);
      var clipLen = prepDraw(clipRect, 35);

      var tl = gsap.timeline({ paused: true });

      // macro camera: very slow lean-in across the scene, settled before the held end
      tl.fromTo(
        byId("camera"),
        { scale: 1 },
        { scale: 1.025, duration: 18.6, ease: "sine.inOut" },
        0
      );

      // ---- Beat 1 (0.0-2.1): portrait on "Margaret", name on "68" ----
      tl.fromTo(
        byId("portrait"),
        { opacity: 0, y: 36, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        byId("name"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        0.96
      );

      // ---- Beat 2 (2.1-3.95): condition pill on "Alzheimer's", then hold ----
      tl.fromTo(
        byId("tag"),
        { opacity: 0, y: 16, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
        2.1
      );

      // ---- Beat 3 (3.95-8.2): right half opens on "identified", count on "573" ----
      // empty slots wave in (index order)
      tl.fromTo(
        dots,
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 0.55, duration: 0.35, ease: "power2.out", stagger: { amount: 0.5 } },
        3.95
      );
      tl.fromTo(
        byId("card"),
        { opacity: 0, y: 24, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        4.15
      );
      tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.4);

      // counting-dynamic-scale: value + transform scale share timing and ease
      // (direct innerText tween + snap — no callback, so it stays correct under
      // any seek mode, including seeks that suppress events)
      var COUNT_AT = 4.6;
      var COUNT_DUR = 1.6;
      var COUNT_EASE = "power2.out";
      tl.fromTo(
        num,
        { innerText: 0 },
        {
          innerText: TOTAL,
          snap: { innerText: 1 },
          duration: COUNT_DUR,
          ease: COUNT_EASE,
        },
        COUNT_AT
      );
      tl.fromTo(num, { scale: 0.45 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      // stat fill: dot n lands exactly when the shared power2.out count reaches n
      // (inverse of power2.out: x = 1 - sqrt(1 - p)) — deterministic stagger
      for (var k = 0; k < TOTAL; k++) {
        var p = (k + 1) / TOTAL;
        var at = COUNT_AT + COUNT_DUR * (1 - Math.sqrt(1 - p));
        tl.fromTo(
          dots[k],
          { scale: 0.55, backgroundColor: SLOT },
          {
            scale: 1,
            backgroundColor: PRIMARY,
            duration: 0.28,
            ease: "power2.out",
            immediateRender: false,
          },
          at
        );
      }

      // label on "existing drugs"
      tl.fromTo(
        byId("label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        5.9
      );
      // source line, as the sentence closes on "help her"
      tl.fromTo(
        byId("source"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        7.45
      );

      // ---- Beat 4 (8.2-11.9): "Few have ever been tested" -> first closing line,
      //      grey wave across the field, a scattered handful stays purple ----
      tl.fromTo(
        byId("line1"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        8.22
      );
      tl.fromTo(
        greyDots,
        { backgroundColor: PRIMARY, scale: 1 },
        {
          backgroundColor: LIGHT,
          scale: 0.75,
          duration: 0.35,
          ease: "power1.out",
          stagger: { amount: 0.85 },
          immediateRender: false,
        },
        8.25
      );
      // the few that stay purple settle slightly larger as the wave passes, so they read
      var fewDots = [];
      for (var h = 0; h < TOTAL; h++) {
        if (isFew[h]) fewDots.push(dots[h]);
      }
      tl.fromTo(
        fewDots,
        { scale: 1 },
        { scale: 1.3, duration: 0.6, ease: "power3.out", immediateRender: false },
        9.0
      );
      tl.fromTo(
        num,
        { color: PRIMARY },
        { color: LIGHT, duration: 0.8, ease: "power1.out", immediateRender: false },
        8.3
      );
      // ---- Beat 5 (11.9-16.25): "no evidence to recommend" -> second closing line ----
      tl.fromTo(
        byId("line2"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        11.9
      );

      // ---- Beat 6 (16.25-end): "nobody records what happens" -> third line + empty record ----
      tl.fromTo(
        byId("line3"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        16.25
      );
      // empty clipboard draws itself on "records"; its blank lines stay blank
      tl.fromTo(
        boardPath,
        { strokeDashoffset: boardLen + 20 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        16.65
      );
      tl.fromTo(
        clipRect,
        { strokeDashoffset: clipLen + 20 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        16.95
      );
      tl.fromTo(
        byId("record-blank"),
        { opacity: 0 },
        { opacity: 0.7, duration: 0.4, ease: "power1.out" },
        17.15
      );

      // hold still; anchor the end to the fixed scene length (narration 18.985 + 0.5)
      tl.set({}, {}, 19.485);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-meet-margaret"] = tl;
    })();
  </script>

</template>
