  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var P = "01-meet-margaret-";
      var byId = function (s) {
        return document.getElementById(P + s);
      };

      var PRIMARY = "#694CFA";
      var LIGHT = "#94A3B8";
      var SLOT = "rgba(105, 76, 250, 0.18)";
      var TOTAL = 573; // one dot per candidate drug (24 columns)

      // build the dot field deterministically, index order = row-major
      var field = byId("field");
      field.textContent = "";
      var dots = [];
      for (var i = 0; i < TOTAL; i++) {
        var d = document.createElement("span");
        field.appendChild(d);
        dots.push(d);
      }

      var num = byId("num");
      num.textContent = "0";

      // svg-path-draw setup: measured length, dash parked fully off the path
      function prepDraw(path, fallback) {
        var len = 0;
        try {
          len = path.getTotalLength();
        } catch (e) {
          len = 0;
        }
        if (!(len > 0)) len = fallback;
        path.style.strokeDasharray = len + " " + (len + 40);
        path.style.strokeDashoffset = String(len + 20);
        return len;
      }
      var bodyPath = byId("lockbody-path");
      var shacklePath = byId("shackle-path");
      var bodyLen = prepDraw(bodyPath, 1776);
      var shackleLen = prepDraw(shacklePath, 523);

      var tl = gsap.timeline({ paused: true });

      // macro camera: very slow lean-in that settles before the held silence
      tl.fromTo(
        byId("camera"),
        { scale: 1 },
        { scale: 1.025, duration: 9.6, ease: "sine.inOut" },
        0
      );

      // ---- Scene 1 (0.0-1.7): portrait settles, composite pill, name on "68" ----
      tl.fromTo(
        byId("portrait"),
        { opacity: 0, y: 36, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        byId("composite"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        byId("name"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        0.62
      );

      // ---- Scene 2 (1.7-3.3): condition pill on "Alzheimer's", then hold ----
      tl.fromTo(
        byId("tag"),
        { opacity: 0, y: 16, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
        1.7
      );

      // ---- Scene 3 (3.3-7.9): right half opens on "flagged", count on "573" ----
      // empty slots wave in (index order)
      tl.fromTo(
        dots,
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 0.55, duration: 0.35, ease: "power2.out", stagger: { amount: 0.5 } },
        4.05
      );
      tl.fromTo(
        byId("card"),
        { opacity: 0, y: 24, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        4.25
      );
      tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.45);

      // counting-dynamic-scale: value + transform scale share timing and ease
      // (direct innerText tween + snap — no callback, so it stays correct under
      // any seek mode, including seeks that suppress events)
      var COUNT_AT = 4.6;
      var COUNT_DUR = 1.6;
      var COUNT_EASE = "power2.out";
      tl.fromTo(
        num,
        { innerText: 0 },
        {
          innerText: TOTAL,
          snap: { innerText: 1 },
          duration: COUNT_DUR,
          ease: COUNT_EASE,
        },
        COUNT_AT
      );
      tl.fromTo(num, { scale: 0.45 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      // stat fill: dot n lands exactly when the shared power2.out count reaches n
      // (inverse of power2.out: x = 1 - sqrt(1 - p)) — deterministic stagger
      for (var k = 0; k < TOTAL; k++) {
        var p = (k + 1) / TOTAL;
        var at = COUNT_AT + COUNT_DUR * (1 - Math.sqrt(1 - p));
        tl.fromTo(
          dots[k],
          { scale: 0.55, backgroundColor: SLOT },
          {
            scale: 1,
            backgroundColor: PRIMARY,
            duration: 0.28,
            ease: "power2.out",
            immediateRender: false,
          },
          at
        );
      }

      // label on "existing drugs"
      tl.fromTo(
        byId("label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        6.05
      );
      // source line
      tl.fromTo(
        byId("source"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        7.5
      );

      // ---- Scene 4 (7.9-10.133): "She can't get" -> grey wave + lock ----
      tl.fromTo(
        dots,
        { backgroundColor: PRIMARY },
        {
          backgroundColor: LIGHT,
          duration: 0.3,
          ease: "power1.out",
          stagger: { amount: 0.45 },
          immediateRender: false,
        },
        8.68
      );
      tl.fromTo(
        num,
        { color: PRIMARY },
        { color: LIGHT, duration: 0.5, ease: "power1.out", immediateRender: false },
        8.7
      );
      // lock body traces the counter card, then the (open) shackle, then it clicks shut
      tl.fromTo(
        bodyPath,
        { strokeDashoffset: bodyLen + 20 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        8.75
      );
      tl.fromTo(
        shacklePath,
        { strokeDashoffset: shackleLen + 20 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        9.16
      );
      tl.fromTo(byId("shackle"), { y: -30 }, { y: 0, duration: 0.18, ease: "power2.in" }, 9.56);

      // closing line on "single one", then hold still
      tl.fromTo(
        byId("final"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        9.3
      );

      // anchor the held silence to the fixed frame length
      tl.set({}, {}, 10.133);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-meet-margaret"] = tl;
    })();
  </script>


  <script>
    // retime-to-new-voice: drive this scene's original timeline through a map from the
    // new narration's time to the old narration's time, anchored on matching spoken cues.
    (function () {
      var ID = "01-meet-margaret";
      var inner = window.__timelines[ID];
      var MAP = [[0.000,0.000],[0.700,0.811],[3.380,2.816],[4.600,3.840],[8.680,7.083],[9.980,8.324]]; // [old seconds, new seconds]
      var NEW_DURATION = 9.568;
      function toOld(t) {
        for (var i = 1; i < MAP.length; i++) {
          if (t <= MAP[i][1]) {
            var a = MAP[i - 1], b = MAP[i];
            return a[0] + (t - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
          }
        }
        var last = MAP[MAP.length - 1];
        return last[0] + (t - last[1]); // after the last cue, real time (holds stay holds)
      }
      var OLD_END = toOld(NEW_DURATION);
      var outer = gsap.timeline({ paused: true });
      outer.fromTo(inner, { time: 0 }, {
        time: OLD_END, duration: NEW_DURATION,
        ease: function (p) { return toOld(p * NEW_DURATION) / OLD_END; },
      }, 0);
      window.__timelines[ID] = outer;
    })();
  </script>
