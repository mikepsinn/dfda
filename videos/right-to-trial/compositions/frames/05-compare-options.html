    // ---------- camera geometry (all page coordinates are CSS px of the 1440-wide captures) ----------

    var VH = 637; // clipped viewport height (screen px)
    var S0 = VW / 1440; // screen px per page CSS px at camera scale 1
    var K0 = VW / 2880; // screen px per capture px (captures are 2x)
    var CX = VW / 2;
    var CY = VH / 2;

    // coordinate-target-zoom (nested form): outer scale s about the viewport centre,
    // inner translate T = centre - S0 * target  (independent of s)
    function cam(cx, cy, s) {
      return { cx: cx, cy: cy, s: s, x: CX - S0 * cx, y: CY - S0 * cy };
    }
    // where a page point lands in the viewport under a camera state
    function view(px, py, c) {
      return { x: CX + c.s * S0 * (px - c.cx), y: CY + c.s * S0 * (py - c.cy) };
    }

    var R0 = cam(720, CY / S0, 1); // rankings: top of page (identity)
    var R1 = cam(720, 830, 1.2); // rankings: heading + Donanemab / Lecanemab cards

      el.style.left = b[0] * 2 + "px";

      el.style.width = (b[2] - b[0]) * 2 + "px";
      el.style.height = (b[3] - b[1]) * 2 + "px";
