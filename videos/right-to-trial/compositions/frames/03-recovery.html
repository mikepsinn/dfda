  <script>
    (function () {

            var a = MAP[i - 1], b = MAP[i];
            return a[0] + (t - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
          }
        }
        var last = MAP[MAP.length - 1];
        return last[0] + (t - last[1]); // after the last cue, real time (holds stay holds)
