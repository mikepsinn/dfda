  <script>
    (function () {
      var ID = "04-the-fix";
      var DURATION = 8.746;
      var el = function (name) {
        return document.getElementById(ID + "-" + name);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–3.3s): the path draws itself 0.2–3.0s, steps pop on as the line reaches them ----
      var SEG_START = 0.2; // first segment leaves step 1
      var SEG_END = 3.0; // the line lands on the star
      var SEG_DUR = (SEG_END - SEG_START) / 6; // constant-speed pen per segment (ease: none)
      var EDGE_LEAD = SEG_DUR * 0.75; // line reaches the next circle's edge ~75% into its segment
      var POP_DUR = 0.55;
      var ICON_DELAY = 0.1;
      var ICON_DUR = 0.45;

      var icons = {
        1: ["icon-1a", "icon-1b"],
        2: ["icon-2a", "icon-2b", "icon-2c"],
        3: ["icon-3a", "icon-3b"],
        4: ["icon-4a", "icon-4b"],
        5: ["icon-5a", "icon-5b"],
        6: ["icon-6a", "icon-6b", "icon-6c", "icon-6d"],
        7: ["icon-7a"],
      };

      // dash offsets tween as SVG attributes: the CSS route rounds px to whole
      // numbers, which would turn a 0–1 normalized (pathLength="1") draw into a jump
      function popStep(n, at) {
        tl.fromTo(
          el("dot-" + n),
          { scale: 0.6 },
          { scale: 1, duration: POP_DUR, ease: "power3.out" },
          at,
        );
        // opacity lands fast so the line passing under the circle is covered early
        tl.fromTo(
          el("dot-" + n),
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power2.out" },
          at,
        );
        icons[n].forEach(function (name, i) {
          tl.fromTo(
            el(name),
            { attr: { "stroke-dashoffset": 1.05 } },
            { attr: { "stroke-dashoffset": 0 }, duration: ICON_DUR, ease: "power2.out" },
            at + ICON_DELAY + i * 0.1,
          );
        });
      }

      // step 1 is on screen first, then the line leaves it
      popStep(1, 0.08);

      for (var k = 0; k < 6; k++) {
        var segAt = SEG_START + k * SEG_DUR;
        tl.fromTo(
          el("seg-" + k),
          { attr: { "stroke-dashoffset": 1.05 } },
          { attr: { "stroke-dashoffset": 0 }, duration: SEG_DUR, ease: "none" },
          segAt,
        );
        popStep(k + 2, segAt + EDGE_LEAD);
      }

      // the seventh step: orange circle, star outline draws, then fills
      var STAR_AT = SEG_START + 5 * SEG_DUR + EDGE_LEAD;
      tl.fromTo(
        el("icon-7a"),
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.35, ease: "power1.out" },
        STAR_AT + ICON_DELAY + ICON_DUR - 0.05,
      );

      // title lockup on its voiceover cues: "care-integrated" 1.02 · "clinical" 2.09 · "trials" 2.48
      tl.fromTo(
        el("accent"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0.86,
      );
      [
        ["word-1", 1.0],
        ["word-2", 2.07],
        ["word-3", 2.46],
      ].forEach(function (w) {
        tl.fromTo(
          el(w[0]),
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          w[1],
        );
      });

      // ---- Scene 2 (3.3–6.9s): the two promises under the title ----
      // "treatment" (3.41)
      tl.fromTo(
        el("promise-1"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        3.38,
      );
      // "every result" (5.04) — slightly bolder line, small check pops and draws
      var P2_AT = 5.0;
      tl.fromTo(
        el("promise-2"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        P2_AT,
      );
      tl.fromTo(
        el("check"),
        { scale: 0.6 },
        { scale: 1, duration: POP_DUR, ease: "power3.out" },
        P2_AT + 0.04,
      );
      tl.fromTo(
        el("check-mark"),
        { attr: { "stroke-dashoffset": 1.05 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" },
        P2_AT + 0.16,
      );

      // ---- Scene 3 (6.9–8.7s): "Here's Margaret's year" (6.96) — she settles onto step 1 ----
      var M_AT = 6.92;
      tl.fromTo(
        el("avatar"),
        { opacity: 0, y: -40, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        M_AT,
      );
      // one bounded glow fade-up on step 1
      tl.fromTo(
        [el("halo"), el("ring")],
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
        M_AT + 0.12,
      );
      // the other six steps dim slightly
      tl.fromTo(
        [el("node-2"), el("node-3"), el("node-4"), el("node-5"), el("node-6"), el("node-7")],
        { opacity: 1 },
        { opacity: 0.6, duration: 0.6, ease: "power1.inOut" },
        M_AT + 0.12,
      );

      // near-imperceptible push toward step 1 under the back half (hands off to the next frame);
      // ends exactly at the frame length, anchoring the timeline to DURATION
      var PUSH_AT = 3.3;
      tl.fromTo(
        el("stage"),
        { scale: 1 },
        { scale: 1.04, duration: DURATION - PUSH_AT, ease: "power1.in" },
        PUSH_AT,
      );

      window.__timelines["04-the-fix"] = tl;
    })();
  </script>
