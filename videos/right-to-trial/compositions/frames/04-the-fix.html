  <script>
    (function () {
      var ID = "04-the-fix";
      var DURATION = 8.322;
      var el = function (name) {
        return document.getElementById(ID + "-" + name);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Cues are word starts from timing/v4-estimated.json (frame 4); each reveal lands ~0.02s before its word.

      // ---- Scene 1 (0.0–2.4s): the six-step path draws itself 0.2–2.4s, steps pop on as the line reaches them ----
      var SEG_START = 0.2; // first segment leaves step 1
      var SEG_END = 2.4; // the line lands on the star
      var SEG_COUNT = 5;
      var SEG_DUR = (SEG_END - SEG_START) / SEG_COUNT; // constant-speed pen per segment (ease: none)
      var EDGE_LEAD = SEG_DUR * 0.75; // line reaches the next circle's edge ~75% into its segment
      var POP_DUR = 0.55;
      var ICON_DELAY = 0.1;
      var ICON_DUR = 0.45;

      var icons = {
        1: ["icon-1a", "icon-1b"],
        2: ["icon-2a", "icon-2b", "icon-2c"],
        3: ["icon-3a", "icon-3b"],
        4: ["icon-4a", "icon-4b"],
        5: ["icon-5a", "icon-5b", "icon-5c", "icon-5d"],
        6: ["icon-6a"],
      };

      // dash offsets tween as SVG attributes: the CSS route rounds px to whole
      // numbers, which would turn a 0–1 normalized (pathLength="1") draw into a jump
      function popStep(n, at) {
        tl.fromTo(
          el("dot-" + n),
          { scale: 0.6 },
          { scale: 1, duration: POP_DUR, ease: "power3.out" },
          at,
        );
        // opacity lands fast so the line passing under the circle is covered early
        tl.fromTo(
          el("dot-" + n),
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power2.out" },
          at,
        );
        icons[n].forEach(function (name, i) {
          tl.fromTo(
            el(name),
            { attr: { "stroke-dashoffset": 1.05 } },
            { attr: { "stroke-dashoffset": 0 }, duration: ICON_DUR, ease: "power2.out" },
            at + ICON_DELAY + i * 0.1,
          );
        });
      }

      // step 1 is on screen first, then the line leaves it
      popStep(1, 0.08);

      for (var k = 0; k < SEG_COUNT; k++) {
        var segAt = SEG_START + k * SEG_DUR;
        tl.fromTo(
          el("seg-" + k),
          { attr: { "stroke-dashoffset": 1.05 } },
          { attr: { "stroke-dashoffset": 0 }, duration: SEG_DUR, ease: "none" },
          segAt,
        );
        popStep(k + 2, segAt + EDGE_LEAD);
      }

      // the sixth step: orange circle, star outline draws, then fills
      var STAR_AT = SEG_START + (SEG_COUNT - 1) * SEG_DUR + EDGE_LEAD;
      tl.fromTo(
        el("icon-6a"),
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.35, ease: "power1.out" },
        STAR_AT + ICON_DELAY + ICON_DUR - 0.05,
      );

      // title lockup on its words: "Care-integrated" 0.309 · "clinical" 1.149 · "trials" 1.668
      tl.fromTo(
        el("accent"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0.2,
      );
      [
        ["word-1", 0.29],
        ["word-2", 1.13],
        ["word-3", 1.65],
      ].forEach(function (w) {
        tl.fromTo(
          el(w[0]),
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          w[1],
        );
      });

      // ---- Scene 2 (2.4–5.6s): "would do the same for every disease, in everyday care" ----
      // "do" (2.437): the line arrives; its last phrase waits for "in everyday care" (4.383)
      [
        ["line-1a", 2.42],
        ["line-1b", 4.36],
      ].forEach(function (p) {
        tl.fromTo(
          el(p[0]),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          p[1],
        );
      });

      // ---- Scene 3 (5.6–8.4s): "Here's" (5.643) brings the turn line; on "Margaret's" (6.001) she settles onto step 1 ----
      tl.fromTo(
        el("line-2a"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        5.62,
      );
      var M_AT = 5.98;
      tl.fromTo(
        el("avatar"),
        { opacity: 0, y: -40, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        M_AT,
      );
      // one bounded glow fade-up on step 1
      tl.fromTo(
        [el("halo"), el("ring")],
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
        M_AT + 0.12,
      );
      // the other five steps dim slightly
      tl.fromTo(
        [el("node-2"), el("node-3"), el("node-4"), el("node-5"), el("node-6")],
        { opacity: 1 },
        { opacity: 0.6, duration: 0.6, ease: "power1.inOut" },
        M_AT + 0.12,
      );

      // near-imperceptible push toward step 1 under the back half (hands off to the next frame);
      // ends exactly at the frame length
      var PUSH_AT = 2.6;
      tl.fromTo(
        el("stage"),
        { scale: 1 },
        { scale: 1.04, duration: DURATION - PUSH_AT, ease: "power1.in" },
        PUSH_AT,
      );

      // anchor the timeline to the full scene length
      tl.set({}, {}, 8.322);

      window.__timelines["04-the-fix"] = tl;
    })();
  </script>
