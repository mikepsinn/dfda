          <circle
            id="12-close-next-ring-stroke"
            class="12-close-ring-stroke"
            pathLength="1"
            cx="124"
            cy="124"
            r="120"
            stroke="#f0a050"
            transform="rotate(-90 124 124)"
          />
        </svg>
        <div id="12-close-badge">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              id="12-close-badge-star"
              d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.49l-5.87 3.09 1.12-6.54L2.5 9.41l6.56-.95z"
            />
          </svg>
        </div>
        <p id="12-close-label-next" class="12-close-label" style="left: 1486px">Next patient</p>
      </div>

      <!-- end card -->
      <div id="12-close-endcard">
        <p id="12-close-end-lead">Learn more at</p>
        <p id="12-close-end-url">acceleratedmedicine.org</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "12-close";
      var el = function (name) {
        return document.getElementById(ID + "-" + name);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Cues are word starts from timing/v4-estimated.json (frame 10); each reveal lands ~0.02s before its word.

      // Dash offsets tween as SVG attributes on pathLength="1" strokes: the CSS route
      // rounds px to whole numbers, which would turn a 0–1 normalized draw into a jump.
      function draw(name, at, dur, ease) {
        tl.fromTo(
          el(name),
          { attr: { "stroke-dashoffset": 1.05 } },
          { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: ease || "power2.out" },
          at,
        );
      }

      // ---- Scene 1 (0.0–2.1s): the six-step path draws across the top, every dot lit ----
      var SEG_START = 0.2;
      var SEG_DUR = 0.3; // constant-speed pen per segment
      var SEG_COUNT = 5;
      var EDGE_LEAD = 0.22; // line reaches the next circle ~75% into its segment
      var icons = {
        1: ["icon-1a", "icon-1b"],
        2: ["icon-2a", "icon-2b", "icon-2c"],
        3: ["icon-3a", "icon-3b"],
        4: ["icon-4a", "icon-4b"],
        5: ["icon-5a", "icon-5b", "icon-5c", "icon-5d"],
        6: ["icon-6a"],
      };

      function popStep(n, at) {
        tl.fromTo(el("dot-" + n), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(el("dot-" + n), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, at);
        icons[n].forEach(function (name, i) {
          draw(name, at + 0.1 + i * 0.08, 0.4);
        });
      }

      popStep(1, 0.06);
      for (var k = 0; k < SEG_COUNT; k++) {
        var segAt = SEG_START + k * SEG_DUR;
        draw("seg-" + k, segAt, SEG_DUR, "none");
        popStep(k + 2, segAt + EDGE_LEAD);
      }
      var STAR_AT = SEG_START + (SEG_COUNT - 1) * SEG_DUR + EDGE_LEAD;
      tl.fromTo(
        el("icon-6a"),
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.35, ease: "power1.out" },
        STAR_AT + 0.45,
      );

      // "Care-Integrated Clinical Trials" — not spoken; a quick per-word fade-up as the scene opens
      [
        ["word-1", 0.05],
        ["word-2", 0.17],
        ["word-3", 0.29],
      ].forEach(function (w) {
        tl.fromTo(
          el(w[0]),
          { opacity: 0, y: 28, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
          w[1],
        );
      });

      // ---- Scene 2 (0.3–10.0s): four lines, one per sentence ----
      var chipIcons = {
        1: ["chip-1a", "chip-1b"],
        2: ["chip-2a", "chip-2b", "chip-2c", "chip-2d", "chip-2e"],
        3: ["chip-3a", "chip-3b", "chip-3c", "chip-3d"],
        4: ["chip-4a", "chip-4b", "chip-4c", "chip-4d"],
      };
      function revealLine(n, cue) {
        tl.fromTo(el("chip-" + n), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, cue - 0.04);
        tl.fromTo(el("chip-" + n), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, cue - 0.04);
        chipIcons[n].forEach(function (name, i) {
          draw(name, cue + 0.08 + i * 0.07, 0.42);
        });
        tl.fromTo(
          el("line-" + n),
          { opacity: 0, x: -28 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          cue,
        );
      }
      revealLine(1, 0.29); // "Any" 0.309
      revealLine(2, 3.79); // "Clinics" 3.811
      revealLine(3, 5.92); // "Every" 5.944
      revealLine(4, 7.83); // "the" 7.853 (… next patient learns from Margaret)

      // on "treatment" (1.527): a lit wave runs the whole path (bounded fade-up, settles lit)
      for (var h = 1; h <= 6; h++) {
        var hAt = 1.5 + (h - 1) * 0.12;
        tl.fromTo(el("halo-" + h), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, hAt);
        tl.fromTo(
          el("halo-" + h),
          { opacity: 1 },
          { opacity: 0.4, duration: 0.8, ease: "power1.inOut", immediateRender: false },
          hAt + 0.35,
        );
      }

      // ---- on "published" (6.924): line 3 glows, settles ----
      var PUB_AT = 6.9;
      tl.fromTo(el("glow-3"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, PUB_AT);
      tl.fromTo(
        el("glow-3"),
        { opacity: 1 },
        { opacity: 0.3, duration: 1.0, ease: "power1.inOut", immediateRender: false },
        PUB_AT + 0.57,
      );
      tl.fromTo(
        el("chip-ring-3"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" },
        PUB_AT,
      );
      tl.fromTo(
        el("chip-ring-3"),
        { opacity: 1 },
        { opacity: 0.35, duration: 1.0, ease: "power1.inOut", immediateRender: false },
        PUB_AT + 0.57,
      );

      // ---- Scene 3 (8.1–10.3s): the next patient, then Margaret, joined by the arrow ----
      // "next patient" (8.104): the silhouette settles in with its orange ring
      var NEXT_AT = 8.08;
      tl.fromTo(
        el("next"),
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        NEXT_AT,
      );
      draw("next-ring-stroke", NEXT_AT + 0.12, 0.6);
      tl.fromTo(
        el("label-next"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        NEXT_AT + 0.22,
      );

      // "Margaret" (9.59): her avatar, then the arrow draws from her to the next patient
      var MARG_AT = 9.57;
      tl.fromTo(
        el("margaret"),
        { opacity: 0, scale: 0.75, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        MARG_AT,
      );
      draw("margaret-ring-stroke", MARG_AT + 0.11, 0.6);
      tl.fromTo(
        el("label-margaret"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        MARG_AT + 0.18,
      );
      draw("arrow-line", MARG_AT + 0.15, 0.4, "power2.inOut");
      draw("arrow-head", MARG_AT + 0.49, 0.2, "power2.out");
      tl.fromTo(el("badge"), { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "power3.out" }, MARG_AT + 0.53);
      tl.fromTo(el("badge"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, MARG_AT + 0.53);

      // slow camera push under the build; still once the end card lands
      tl.fromTo(el("stage"), { scale: 1 }, { scale: 1.02, duration: 10.3, ease: "sine.inOut" }, 0);

      // ---- Scene 4 (10.3–14.18s): "Learn more" (10.335) — the end card settles and holds to the end ----
      var END_AT = 10.31;
      // inverse zoom-through: the name recedes, the end card arrives from just behind the camera
      tl.fromTo(
        el("title"),
        { scale: 1, filter: "blur(0px)" },
        { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        END_AT - 0.06,
      );
      tl.fromTo(
        el("title"),
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
        END_AT - 0.06,
      );
      tl.fromTo(
        el("endcard"),
        { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        END_AT,
      );
      tl.fromTo(el("bloom"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, END_AT);
      // the lines and avatars fall back to 35% once the card has landed ("at" 10.997)
      tl.fromTo(
        el("body"),
        { opacity: 1, scale: 1 },
        { opacity: 0.35, scale: 0.97, duration: 0.9, ease: "power2.inOut", immediateRender: false },
        10.98,
      );

      // hold the end card, still, to the last frame (no fade-out)
      tl.set({}, {}, 14.18);

      window.__timelines["12-close"] = tl;
    })();
  </script>
</template>
