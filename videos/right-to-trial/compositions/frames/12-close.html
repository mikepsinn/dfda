        40px 40px;
      background-position:

      top: 0;

        <p id="12-close-label-next" class="12-close-label" style="left: 1410px">Next patient</p>
      </div>

      <!-- end card (Scene 5) -->
      <div id="12-close-endcard">
        <p id="12-close-end-title">The Care-Integrated Clinical Trials Initiative</p>
        <p id="12-close-end-sub">acceleratedmedicine.org</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "12-close";
      var DURATION = 14.71;
      var el = function (name) {
        return document.getElementById(ID + "-" + name);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Dash offsets tween as SVG attributes on pathLength="1" strokes: the CSS route
      // rounds px to whole numbers, which would turn a 0–1 normalized draw into a jump.
      function draw(name, at, dur, ease) {
        tl.fromTo(
          el(name),
          { attr: { "stroke-dashoffset": 1.05 } },
          { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: ease || "power2.out" },
          at,
        );
      }

      // ---- Scene 1 (0.0–2.0s): the path draws across the top, every dot lit ----
      var SEG_START = 0.2;
      var SEG_DUR = 0.3; // constant-speed pen per segment
      var EDGE_LEAD = 0.22; // line reaches the next circle ~75% into its segment
      var icons = {
        1: ["icon-1a", "icon-1b"],
        2: ["icon-2a", "icon-2b", "icon-2c"],
        3: ["icon-3a", "icon-3b"],
        4: ["icon-4a", "icon-4b"],
        5: ["icon-5a", "icon-5b"],
        6: ["icon-6a", "icon-6b", "icon-6c", "icon-6d"],
        7: ["icon-7a"],
      };

      function popStep(n, at) {
        tl.fromTo(el("dot-" + n), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(el("dot-" + n), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, at);
        icons[n].forEach(function (name, i) {
          draw(name, at + 0.1 + i * 0.08, 0.4);
        });
      }

      popStep(1, 0.06);
      for (var k = 0; k < 6; k++) {
        var segAt = SEG_START + k * SEG_DUR;
        draw("seg-" + k, segAt, SEG_DUR, "none");
        popStep(k + 2, segAt + EDGE_LEAD);
      }
      var STAR_AT = SEG_START + 5 * SEG_DUR + EDGE_LEAD;
      tl.fromTo(
        el("icon-7a"),
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.35, ease: "power1.out" },
        STAR_AT + 0.45,
      );

      // "Care-Integrated Clinical Trials" — not spoken; a quick per-word fade-up as the scene opens
      [
        ["word-1", 0.05],
        ["word-2", 0.17],
        ["word-3", 0.29],
      ].forEach(function (w) {
        tl.fromTo(
          el(w[0]),
          { opacity: 0, y: 28, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
          w[1],
        );
      });

      // ---- Scene 2 (0.4–6.4s): three lines, one per cue ----
      var chipIcons = {
        1: ["chip-1a", "chip-1b"],
        2: ["chip-2a", "chip-2b", "chip-2c", "chip-2d", "chip-2e"],
        3: ["chip-3a", "chip-3b", "chip-3c", "chip-3d"],
      };
      function revealLine(n, cue) {
        tl.fromTo(el("chip-" + n), { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, cue - 0.04);
        tl.fromTo(el("chip-" + n), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, cue - 0.04);
        chipIcons[n].forEach(function (name, i) {
          draw(name, cue + 0.08 + i * 0.07, 0.42);
        });
        tl.fromTo(
          el("line-" + n),
          { opacity: 0, x: -28 },
          { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
          cue,
        );
      }
      revealLine(1, 0.42); // "Any patient"
      revealLine(2, 2.35); // "Clinics"
      revealLine(3, 4.39); // "Every result"

      // under "Any patient": a lit wave runs the whole path (bounded fade-up, settles lit)
      for (var h = 1; h <= 7; h++) {
        var hAt = 1.0 + (h - 1) * 0.12;
        tl.fromTo(el("halo-" + h), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, hAt);
        tl.fromTo(
          el("halo-" + h),
          { opacity: 1 },
          { opacity: 0.4, duration: 0.8, ease: "power1.inOut", immediateRender: false },
          hAt + 0.35,
        );
      }

      // ---- on "published" (5.38s): line 3 glows, settles ----
      tl.fromTo(el("glow-3"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 5.38);
      tl.fromTo(
        el("glow-3"),
        { opacity: 1 },
        { opacity: 0.3, duration: 1.0, ease: "power1.inOut", immediateRender: false },
        5.95,
      );
      tl.fromTo(
        el("chip-ring-3"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" },
        5.38,
      );
      tl.fromTo(
        el("chip-ring-3"),
        { opacity: 1 },
        { opacity: 0.35, duration: 1.0, ease: "power1.inOut", immediateRender: false },
        5.95,
      );

      // ---- Scene 3 (6.4–10.4s): Margaret, then the arrow to the next patient ----
      tl.fromTo(
        el("margaret"),
        { opacity: 0, scale: 0.75, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" },
        6.49,
      );
      draw("margaret-ring-stroke", 6.62, 0.7);
      tl.fromTo(
        el("label-margaret"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        6.8,
      );

      // "the next patient" (9.04): a faint placeholder appears, the arrow draws to it, it lands
      tl.fromTo(
        el("next"),
        { opacity: 0, scale: 0.9 },
        { opacity: 0.4, scale: 0.96, duration: 0.4, ease: "power2.out" },
        9.04,
      );
      draw("arrow-line", 9.06, 0.5, "power2.inOut");
      draw("arrow-head", 9.46, 0.2, "power2.out");
      tl.fromTo(
        el("next"),
        { opacity: 0.4, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false },
        9.52,
      );
      draw("next-ring-stroke", 9.52, 0.6);
      tl.fromTo(el("badge"), { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 9.79);
      tl.fromTo(el("badge"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 9.79);
      tl.fromTo(
        el("label-next"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        9.89,
      );

      // slow camera push under the build; still once the end card lands
      tl.fromTo(el("stage"), { scale: 1 }, { scale: 1.02, duration: 10.7, ease: "sine.inOut" }, 0);

      // ---- Scene 4 (10.7–14.7s): lines + avatars fall back to 35%, the end card settles ----
      tl.fromTo(
        el("body"),
        { opacity: 1, scale: 1 },
        { opacity: 0.35, scale: 0.97, duration: 0.9, ease: "power2.inOut", immediateRender: false },
        10.7,
      );
      // inverse zoom-through: the title recedes, the full name arrives from just behind the camera
      tl.fromTo(
        el("title"),
        { scale: 1, filter: "blur(0px)" },
        { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        10.75,
      );
      tl.fromTo(
        el("title"),
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
        10.75,
      );
      tl.fromTo(
        el("endcard"),
        { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        10.95,
      );
      tl.fromTo(
        el("end-sub"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        11.35,
      );
      tl.fromTo(el("bloom"), { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 10.85);

      // final frame: gentle fade to the night ground over the last 0.6s
      tl.fromTo(
        el("stage"),
        { opacity: 1 },
        { opacity: 0, duration: 0.6, ease: "power1.inOut", immediateRender: false },
        DURATION - 0.6,
      );

      window.__timelines["12-close"] = tl;
    })();
  </script>
</template>
